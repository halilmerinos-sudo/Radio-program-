<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikap — Sanatçı Arşivi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#14120f;
    --surface:#1e1b17;
    --surface-2:#262219;
    --amber:#e8a33d;
    --text:#f2ede4;
    --muted:#8a8478;
    --line:#332e26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:48px 20px 40px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:38px;
    margin:0 0 28px;
    letter-spacing:-0.01em;
  }
  .key-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--muted);
    display:none;
  }
  .key-box.show{display:block;}
  .key-box a{color:var(--amber);}
  .key-row{display:flex;gap:8px;margin-top:10px;}
  input[type="password"], input[type="text"]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:11px 14px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  input:focus{border-color:var(--amber);}
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  button{
    background:var(--amber);
    color:#1a1509;
    border:none;
    border-radius:8px;
    padding:11px 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  button:hover{filter:brightness(1.08);}
  button.ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    font-weight:500;
  }
  .status{
    font-size:13px;
    color:var(--muted);
    margin:14px 2px 0;
    min-height:18px;
  }
  .tracklist{
    margin-top:28px;
    border-top:1px solid var(--line);
  }
  .track{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .15s;
  }
  .track:hover{background:var(--surface);}
  .track.active{background:var(--surface-2);}
  .track-num{
    font-family:'Fraunces',serif;
    color:var(--muted);
    font-size:15px;
    width:22px;
    flex-shrink:0;
  }
  .track img{
    width:52px;height:52px;
    border-radius:6px;
    object-fit:cover;
    flex-shrink:0;
  }
  .track-info{overflow:hidden;}
  .track-title{
    font-size:14.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-channel{
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .player-dock{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:14px 20px;
    display:none;
    align-items:center;
    gap:16px;
    z-index:10;
  }
  .player-dock.show{display:flex;}
  .vinyl{
    width:44px;height:44px;
    border-radius:50%;
    background:radial-gradient(circle at center, #0d0b08 0 6px, #2a2620 6px 8px, #0d0b08 8px 100%);
    flex-shrink:0;
    animation:spin 3s linear infinite;
    animation-play-state:paused;
    border:1px solid var(--line);
  }
  .vinyl.playing{animation-play-state:running;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .now-playing{flex:1;overflow:hidden;}
  .now-playing .nl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);}
  .now-playing .nt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  
  /* YouTube Player Gizleme Alanı */
  .player-container {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    left: -9999px;
  }
  .empty{
    color:var(--muted);
    font-size:14px;
    padding:24px 4px;
    font-style:italic;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Pikap</div>
  <h1>Sanatçı Arşivi</h1>

  <div class="key-box" id="keyBox">
    Arama yapabilmek için ücretsiz bir <strong>YouTube Data API v3</strong> anahtarı gerekiyor
    (<a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">Google Cloud Console</a>'dan alınır).
    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="API anahtarını buraya yapıştır">
      <button onclick="saveKey()">Kaydet</button>
    </div>
  </div>

  <div class="search-row">
    <input type="text" id="artistInput" placeholder="Sanatçı adı yaz…" onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">Ara</button>
    <button class="ghost" onclick="changeKey()">Anahtar</button>
  </div>
  <div class="status" id="status"></div>

  <div class="tracklist" id="results"></div>
</div>

<div class="player-dock" id="dock">
  <div class="vinyl" id="vinyl"></div>
  <div class="now-playing">
    <div class="nl">Çalıyor</div>
    <div class="nt" id="nowTitle">—</div>
  </div>
  <button class="ghost" onclick="togglePlay()" id="playBtn">Duraklat</button>
</div>

<div class="player-container">
  <div id="player"></div>
</div>

<script>
let apiKey = localStorage.getItem('yt_api_key') || '';
let ytPlayer = null;
let ytReady = false;

// YouTube Iframe API'sini Yükle
function loadYTApi(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('player', {
    height: '200',
    width: '200',
    playerVars: {
      'autoplay': 1,
      'controls': 0
    },
    events: {
      'onReady': () => { ytReady = true; },
      'onStateChange': onPlayerState
    }
  });
};

loadYTApi();

function onPlayerState(e){
  const vinyl = document.getElementById('vinyl');
  const btn = document.getElementById('playBtn');
  if(e.data === YT.PlayerState.PLAYING){
    vinyl.classList.add('playing');
    btn.textContent = 'Duraklat';
  } else {
    vinyl.classList.remove('playing');
    btn.textContent = 'Devam Et';
  }
}

function checkKey(){
  if(!apiKey){
    document.getElementById('keyBox').classList.add('show');
    return false;
  }
  return true;
}

// Sayfa yüklendiğinde anahtar kontrolü yap
document.addEventListener('DOMContentLoaded', () => {
  if (apiKey) {
    document.getElementById('apiKeyInput').value = apiKey;
  }
  checkKey();
});

function saveKey(){
  const v = document.getElementById('apiKeyInput').value.trim();
  if(!v){ return; }
  apiKey = v;
  localStorage.setItem('yt_api_key', apiKey);
  document.getElementById('keyBox').classList.remove('show');
  document.getElementById('status').textContent = 'Anahtar kaydedildi! Sanatçı arayabilirsin.';
}

function changeKey(){
  document.getElementById('keyBox').classList.toggle('show');
}

async function search(){
  const status = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const artist = document.getElementById('artistInput').value.trim();

  if(!checkKey()){
    status.textContent = 'Önce API anahtarını kaydetmeniz gereklidir.';
    return;
  }
  if(!artist){
    status.textContent = 'Lütfen bir sanatçı ismi yazın.';
    return;
  }

  status.textContent = 'Aranıyor…';
  resultsEl.innerHTML = '';

  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=20&q=${encodeURIComponent(artist)}&key=${apiKey}`;
    const res = await fetch(url);
    const data = await res.json();

    if(data.error){
      status.textContent = 'API Hatası: ' + data.error.message;
      return;
    }
    if(!data.items || data.items.length === 0){
      resultsEl.innerHTML = '<div class="empty">Sonuç bulunamadı. Başka bir isim deneyin.</div>';
      status.textContent = '';
      return;
    }

    status.textContent = `${data.items.length} şarkı bulundu — dinlemek için birine tıklayın.`;

    data.items.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'track';
      div.onclick = () => playTrack(item.id.videoId, item.snippet.title, div);
      
      div.innerHTML = `
        <div class="track-num">${String(idx+1).padStart(2,'0')}</div>
        <img src="${item.snippet.thumbnails.default.url}" alt="">
        <div class="track-info">
          <div class="track-title">${escapeHtml(item.snippet.title)}</div>
          <div class="track-channel">${escapeHtml(item.snippet.channelTitle)}</div>
        </div>
      `;
      resultsEl.appendChild(div);
    });

  } catch(err){
    status.textContent = 'Arama yapılırken hata oluştu: ' + err.message;
  }
}

function escapeHtml(str){
  return str.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
}

function playTrack(videoId, title, el){
  document.querySelectorAll('.track').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  document.getElementById('dock').classList.add('show');
  document.getElementById('nowTitle').innerHTML = title;

  if(ytReady && ytPlayer && typeof ytPlayer.loadVideoById === 'function'){
    ytPlayer.loadVideoById(videoId);
  } else {
    setTimeout(() => playTrack(videoId, title, el), 300);
  }
}

function togglePlay(){
  if(!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
  
  const state = ytPlayer.getPlayerState();
  if(state === YT.PlayerState.PLAYING){
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}
</script>

</body>
</html>
